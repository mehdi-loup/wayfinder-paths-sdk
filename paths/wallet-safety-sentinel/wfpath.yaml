schema_version: "0.1"

slug: wallet-safety-sentinel
name: "Wallet Safety Sentinel"
version: "0.1.0"
summary: "Continuously monitors a wallet for risky token approvals and drainer exposure — unlimited ERC-20 allowances, ERC-721/1155 ApprovalForAll, and unverified or known-malicious spenders. Scores wallet safety, surfaces a prioritized revoke list ranked by dollars at risk, and alerts on newly appeared or worsened risk. Read-only analysis; revokes are explicit, gated actions."

primary_kind: bundle
tags:
  - bundle
  - wallet-security
  - token-approvals
  - anti-drainer
  - monitoring
  - defi

components:
  - id: "main"
    kind: script
    path: "scripts/main.py"

applet:
  build_dir: "applet/dist"
  manifest: "applet/applet.manifest.json"

skill:
  enabled: true
  source: generated
  name: "wallet-safety-sentinel"
  description: "Continuously monitors a wallet for risky token approvals and drainer exposure — unlimited ERC-20 allowances, ERC-721/1155 ApprovalForAll, and unverified or known-malicious spenders. Scores wallet safety, surfaces a prioritized revoke list ranked by dollars at risk, and alerts on newly appeared or worsened risk. Read-only analysis; revokes are explicit, gated actions."
  instructions: "skill/instructions.md"
  runtime:
    mode: thin
    package: "wayfinder-paths"
    version: "0.11.0"
    python: ">=3.12,<3.13"
    component: "main"
    bootstrap: uv
    fallback_bootstrap: pipx
    prefer_existing_runtime: true
    require_api_key: false
    api_key_env: "WAYFINDER_API_KEY"
    config_path_env: "WAYFINDER_CONFIG_PATH"
